plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.syncnote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.syncnote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Feature flag подсистемы «Отдельные файлы» (этап F.7).
        // Выключает вкладку «Файлы» на этапе сборки.
        buildConfigField "boolean", "ENABLE_SEPARATE_FILES", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        // Нужен для BuildConfig.ENABLE_SEPARATE_FILES (AGP 8 по умолчанию не генерирует).
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    testImplementation 'junit:junit:4.13.2'
}
